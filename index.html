<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Телефонный барыга</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;600&display=swap">
<style>
:root{--bg:#dde3e8;--card:#f4f6f8;--ink:#1b2430;--mute:#5d6a78;--line:#c3ccd5;--acc:#2f5bff;--accink:#fff;--good:#14804f;--bad:#c23b2e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c24;--card:#212a35;--ink:#e8edf2;--mute:#93a1b0;--line:#33404e;--acc:#6f8fff;--accink:#0d1320;--good:#4cc38a;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#161c24;--card:#212a35;--ink:#e8edf2;--mute:#93a1b0;--line:#33404e;--acc:#6f8fff;--accink:#0d1320;--good:#4cc38a;--bad:#ff7b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Onest,system-ui,sans-serif;max-width:720px;margin-inline:auto;padding:12px 12px 40px}
h1,.num{font-family:Unbounded,Onest,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:17px;margin:0;font-weight:700}
.stats{display:flex;gap:14px;align-items:baseline}
.money{font-size:19px;font-weight:700}
.day{color:var(--mute)}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1}
button{font:600 14px Onest,system-ui,sans-serif;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:9px 12px;border-radius:8px;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px}
.card.step{display:block}
.ph{width:92px;height:92px;flex:none;border-radius:8px}
.info{flex:1;min-width:0}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btns button{padding:7px 10px}
.name{font-weight:600;font-size:16px}
.meta{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:5px;border:1px solid var(--line);margin:0 4px 2px 0}
.tag.locked,.tag.brick{color:var(--bad);border-color:var(--bad)}.tag.custom{color:var(--acc);border-color:var(--acc)}
.up{color:var(--good)}.down{color:var(--bad)}
#log{position:sticky;bottom:0;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:14px;min-height:40px}
.site{border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:10px}
.bar{background:var(--ink);color:var(--bg);padding:7px 12px;font-size:13px;display:flex;gap:8px}
.site .body{padding:12px;background:var(--bg)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
.pl{font-size:13px;color:var(--mute);min-height:18px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pick button{padding:6px 10px;font-weight:400}.pick button.on{font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px}
.sel{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.imgw{flex:none;cursor:pointer;text-align:center}.imgw small{display:block;color:var(--acc);font-size:12px;font-weight:600;margin-top:2px}
.big{width:min(100%,260px);height:auto;aspect-ratio:1;display:block;margin:0 auto;border-radius:10px}
nav button{padding:9px 2px;font-size:13px}
.av{--abg:#fff;--atx:#111;--amu:#7a7a7a;--aln:#e4e4e4;background:var(--abg);color:var(--atx);border-radius:12px;padding:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{--abg:#1d1d1f;--atx:#f2f2f2;--amu:#9a9a9a;--aln:#38383a}}
:root[data-theme="dark"] .av{--abg:#1d1d1f;--atx:#f2f2f2;--amu:#9a9a9a;--aln:#38383a}
.avh{display:flex;align-items:center;gap:8px;font:700 20px Onest,system-ui,sans-serif;margin-bottom:8px}
.avs{display:flex;gap:6px}.avs input{flex:1;min-width:0;font:400 15px Onest,system-ui,sans-serif;padding:9px 12px;border:1.5px solid #0af;border-radius:8px;background:var(--abg);color:var(--atx)}
.avs button{background:#0af;border:0;color:#fff;padding:9px 14px}
.avc{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.avc button{border:1px solid var(--aln);color:var(--atx);font-weight:400;padding:5px 11px;border-radius:16px;white-space:nowrap}.avc button.on{background:#0af;border-color:#0af;color:#fff}
.avg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.avi{min-width:0}.avph{width:100%;height:auto;aspect-ratio:1;border-radius:8px;display:block}
.avp{font-weight:700;font-size:18px;margin-top:6px}.avt{font-size:14px}.avm{font-size:12px;color:var(--amu);margin-top:2px}
.avi .star{color:#ffb21a}.avb{display:block;width:100%;border:0;border-radius:8px;padding:8px;font-size:13px;margin-top:6px}
.avb.h{background:transparent;border:1.5px solid #0af;color:#0af}.avb.m{background:#0af;color:#fff}.avb.d{background:#04e061;color:#05290f}
#wbo{position:fixed;inset:0;overflow:auto;background:#0e1218;color:#e8edf2;z-index:60;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
#wbo .in{max-width:420px;margin:0 auto}
#wbo button{color:#e8edf2;border-color:#8a96a4}#wbo button.on,#wbo button.pri{background:#2f5bff;border-color:#2f5bff;color:#fff}
.pf{width:204px;margin:8px auto;background:#1a1d22;border-radius:28px;padding:7px;border:2px solid #3a4048}
.scr{height:350px;border-radius:21px;overflow:hidden;background:#000;color:#fff;font-size:12px;display:flex;flex-direction:column;position:relative}
.scr.c{align-items:center;justify-content:center;gap:8px;text-align:center;padding:0 10px}
.fbs{padding:14px 12px;line-height:1.6;font-size:11px;font-family:ui-monospace,monospace}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 14px;margin-top:auto;text-align:center;font-size:24px}.apps div{cursor:pointer}.apps small{display:block;font-size:10px}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid #333;font-size:12px;cursor:pointer}
.wt{min-height:22px;text-align:center;font-size:13px;color:#ffd54a}
.keys{display:flex;gap:6px;justify-content:center;margin:4px 0}.keys button{padding:8px 10px}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.pc{border:1.5px solid #8a96a4;border-radius:8px;overflow:hidden;margin-top:12px;background:#f0f0f0;color:#111}.pbar{padding:6px 10px;color:#fff;font-size:13px;background:#444}.pb{padding:10px;font-size:13px}
.pfld{background:#fff;border:1px solid #bbb;padding:5px 8px;font:12px ui-monospace,monospace;margin:6px 0;overflow-wrap:anywhere}
#wbo .pc button{color:#111;border-color:#777}#wbo .pc button.pri{color:#fff}.pc .prog{background:#ccc}
.plog{background:#000;color:#c8f7c8;font:11px/1.4 ui-monospace,monospace;height:140px;overflow:auto;margin:8px 0 0;padding:6px;white-space:pre-wrap}
#ov{position:fixed;inset:0;background:rgba(10,14,20,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#ov .box{background:var(--card);border-radius:12px;padding:14px;max-width:420px;width:100%;max-height:100%;overflow:auto}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <h1>Телефонный барыга</h1>
  <div class="stats"><span class="money num" id="money"></span><span class="day" id="day"></span></div>
</header>
<nav id="nav">
  <button data-t="market">Рынок</button>
  <button data-t="avito">Авито</button>
  <button data-t="stock">Склад</button>
  <button data-t="flash">Прошивка</button>
  <button data-t="bourse">Биржа</button>
</nav>
<main id="view"></main>
<div id="log" role="status">Старт: 10 000 ₽. Ищи дешёвые телефоны и поднимайся.</div>
<div style="margin-top:12px;display:flex;gap:8px"><button class="pri" id="next" style="flex:1">Следующий день</button><button id="reset">Заново</button></div>

<script>
const TOOL={Apple:null,Samsung:"Samsung Flash",Xiaomi:"Mi Flash",Redmi:"Mi Flash",Poco:"Mi Flash",Realme:"Mi Flash",OnePlus:"Color Flash",Huawei:"Magic Flash"};
// [модель, бренд, цена б/у ₽, камера, цвет корпуса]
const M=[
["iPhone 8","Apple",8000,"single","#c9ccd1"],["iPhone X","Apple",11000,"vert2","#8d9097"],["iPhone 11","Apple",17000,"sq2","#3e6b52"],["iPhone 12","Apple",25000,"sq2","#2f4d7a"],
["iPhone 13","Apple",35000,"sq2","#d7a9b0"],["iPhone 14 Pro","Apple",60000,"sq3","#4b4552"],["iPhone 15","Apple",68000,"sq2","#e8dcc0"],
["Samsung Galaxy A12","Samsung",6000,"vert4","#1f2a3d"],["Samsung Galaxy A32","Samsung",9000,"vert4","#6a5aa8"],["Samsung Galaxy A52","Samsung",14000,"vert3","#2b2f36"],
["Samsung Galaxy A54","Samsung",22000,"vert3","#a8c4b0"],["Samsung Galaxy S21","Samsung",20000,"sq3","#7a5a8f"],["Samsung Galaxy S22","Samsung",27000,"vert3","#1c3a2e"],["Samsung Galaxy S23","Samsung",40000,"vert3","#d6c6a5"],
["Redmi Note 9","Redmi",6500,"sq4","#8aa0b4"],["Redmi Note 10","Redmi",8500,"sq4","#2e6f68"],["Redmi Note 12","Redmi",12000,"sq3","#2f3a55"],
["Poco X3 Pro","Poco",9000,"sq4","#2a2a2e"],["Poco F5","Poco",24000,"sq3","#1d1f24"],["Xiaomi 12","Xiaomi",22000,"sq3","#4e6e8f"],
["Realme 8","Realme",7500,"sq4","#2d2d36"],["Realme C55","Realme",8500,"sq3","#d8b04a"],["Realme GT Neo 3","Realme",17000,"sq3","#26364d"],
["OnePlus 8T","OnePlus",13000,"sq4","#b9c7c1"],["OnePlus Nord CE 3","OnePlus",15000,"vert3","#4f6a5f"],["OnePlus 11","OnePlus",38000,"ring","#2b3d34"],
["Huawei P30","Huawei",8000,"vert3","#6a7ccf"],["Huawei P40 Pro","Huawei",15000,"sq4","#cfd3d9"],["Huawei Nova 9","Huawei",12000,"ring","#8a56a8"],
["iPhone SE 2020","Apple",10000,"single","#b8231f"],["iPhone XR","Apple",13000,"single","#e8e0d0"],["iPhone 13 mini","Apple",28000,"sq2","#2b3a55"],["iPhone 14","Apple",42000,"sq2","#3d4a6b"],["iPhone 15 Pro","Apple",85000,"sq3","#8b8680"],
["Samsung Galaxy A22","Samsung",7000,"vert4","#9aa0a6"],["Samsung Galaxy A14","Samsung",9000,"vert3","#2a2c30"],["Samsung Galaxy A33","Samsung",12000,"vert4","#6b8fb5"],["Samsung Galaxy A53","Samsung",16000,"vert4","#dcd6c9"],["Samsung Galaxy S20 FE","Samsung",15000,"sq3","#3f6fb0"],["Samsung Galaxy S21 FE","Samsung",19000,"sq3","#b9b4e0"],["Samsung Galaxy S22 Ultra","Samsung",38000,"vert4","#1f2024"],["Samsung Galaxy S23 Ultra","Samsung",58000,"vert4","#2d3a34"],
["Redmi 9","Redmi",5500,"sq4","#4a6fa5"],["Redmi Note 11","Redmi",10000,"sq4","#2b2d33"],["Redmi Note 13 Pro","Redmi",20000,"sq3","#6a4fa0"],
["Poco M4 Pro","Poco",8500,"sq3","#d3b53b"],["Poco X5 Pro","Poco",14000,"sq3","#1f2327"],["Poco F4 GT","Poco",19000,"sq3","#c9d3d9"],
["Mi 10T","Xiaomi",11000,"sq3","#3a4a63"],["Xiaomi 11T","Xiaomi",16000,"sq3","#c8d4d8"],["Xiaomi 13","Xiaomi",35000,"sq3","#a5c8b0"],
["Realme 9 Pro","Realme",9500,"sq3","#1e2c4a"],["Realme 10","Realme",10500,"sq3","#d9e0e8"],["Realme GT 2 Pro","Realme",28000,"sq3","#e8e4d8"],
["OnePlus Nord 2","OnePlus",12000,"sq3","#3e5560"],["OnePlus 9","OnePlus",20000,"ring","#a9c9cf"],["OnePlus 10T","OnePlus",27000,"vert3","#2d3f3a"],
["Huawei P20 Pro","Huawei",7000,"vert3","#2a3b7a"],["Huawei Nova 10","Huawei",14000,"sq3","#c9d4e2"],["Huawei Mate 40 Pro","Huawei",24000,"ring","#c0c4cc"]
];
const C=[{n:"Отличное",k:1},{n:"Хорошее",k:.82},{n:"Потёртое",k:.62}];
const F={stock:{n:"Стоковая",k:1},locked:{n:"Заблокирован",k:.45},custom:{n:"Кастомная прошивка",k:1.12},brick:{n:"Кирпич",k:.1}};
const MAXINV=8,KEY="phoneflip_v3";
let S,tab="market",sel=null,busy=false,ft="off",fb={};
const R=(a,b)=>a+Math.random()*(b-a),$=id=>document.getElementById(id),rub=n=>Math.round(n).toLocaleString("ru-RU")+" ₽";
const isIos=p=>M[p.m][1]==="Apple";
function fresh(){S={money:10000,day:1,nid:1,drift:M.map(()=>1),inv:[],market:[],dl:{fw:{},tool:{}}};gen()}
function val(p){return Math.round(M[p.m][2]*S.drift[p.m]*C[p.c].k*F[p.fw].k)}
function gen(){S.market=[];const cheap=M.map((x,i)=>i).filter(i=>M[i][2]<=12000);
 for(let i=0;i<8;i++){const m=i<4?cheap[Math.floor(Math.random()*cheap.length)]:Math.floor(Math.random()*M.length);
  const p={id:S.nid++,m,c:Math.floor(Math.random()*3)};p.fw=(!isIos(p)&&Math.random()<.25)?"locked":"stock";
  p.price=Math.round(val(p)*(Math.random()<.12?R(1.08,1.2):R(.6,.92))/100)*100;S.market.push(p)}genAvito()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s){S=JSON.parse(s);return}}catch(e){}fresh()}
function say(t){$("log").textContent=t}
function tags(p){return `<span class="tag">${C[p.c].n}</span><span class="tag ${p.fw}">${F[p.fw].n}</span>`}
function trend(m){const d=S.drift[m]-1;return d>.01?`<span class="up">▲${(d*100).toFixed(0)}%</span>`:d<-.01?`<span class="down">▼${(-d*100).toFixed(0)}%</span>`:""}

/* ---- Картинка: телефон лежит на деревянном столе, вид сзади ---- */
function cam(t){const L=(x,y,r=3.4)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#0b0e13" stroke="#8a929d" stroke-width=".8"/><circle cx="${x-.9}" cy="${y-.9}" r=".8" fill="#6d8fc0"/>`;
 const B=(w,h,x,y)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="rgba(0,0,0,.3)" stroke="rgba(255,255,255,.28)" stroke-width=".6"/>`;
 return {single:L(-17,-46),vert2:B(13,25,-24,-52)+L(-17.5,-44)+L(-17.5,-33),sq2:B(26,26,-25,-52)+L(-17,-44,4.5)+L(-8,-33,4.5),
 sq3:B(26,26,-25,-52)+L(-18,-44)+L(-8,-44)+L(-13,-33),sq4:B(26,26,-25,-52)+L(-18,-44,3.2)+L(-8,-44,3.2)+L(-18,-33,3.2)+L(-8,-33,3.2),
 vert3:L(-17,-47)+L(-17,-38)+L(-17,-29),vert4:L(-17,-48,3)+L(-17,-40,3)+L(-17,-32,3)+L(-17,-24,3),
 ring:`<circle cx="-11" cy="-40" r="15" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.3)" stroke-width=".7"/>`+L(-16,-45,4)+L(-6,-45,4)+L(-11,-34,4)}[t]}
function img(p){const [n,br,,ct,col]=M[p.m],a=((p.id*37)%26)-13,u="p"+p.id,body=p.fw==="brick"?"#26282d":col;
 let sc="";const k=[0,2,5][p.c];for(let i=0;i<k;i++){const x=((p.id*13+i*29)%44)-22,y=((p.id*7+i*41)%90)-30;sc+=`<line x1="${x}" y1="${y}" x2="${x+7+i*2}" y2="${y+5-i}" stroke="rgba(255,255,255,.4)" stroke-width=".5"/>`}
 if(p.c===2)sc+=`<path d="M28 52 l-5 5 l-3 -1 l5 -6z" fill="rgba(0,0,0,.35)"/>`;
 if(p.fw==="brick")sc+=`<polyline points="-20,-10 -8,-2 -12,8 2,16 -4,28" fill="none" stroke="rgba(255,255,255,.3)" stroke-width=".7"/>`;
 const logo=br==="Apple"?`<circle cx="0" cy="2" r="3.6" fill="rgba(255,255,255,.55)"/>`:`<text y="6" text-anchor="middle" font-size="5.5" font-family="sans-serif" fill="rgba(255,255,255,.7)">${br}</text>`;
 return `<svg class="ph" viewBox="0 0 120 120" role="img" aria-label="${n}"><defs><linearGradient id="t${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6a3f"/><stop offset="1" stop-color="#6b4325"/></linearGradient>
 <linearGradient id="s${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="b${u}"><feGaussianBlur stdDeviation="2"/></filter></defs>
 <rect width="120" height="120" fill="url(#t${u})"/><g stroke="rgba(0,0,0,.28)" stroke-width=".8"><line x1="0" y1="40" x2="120" y2="40"/><line x1="0" y1="80" x2="120" y2="80"/></g>
 <g stroke="rgba(60,30,10,.22)" stroke-width=".4"><path d="M0 12h120M0 26h120M0 54h120M0 67h120M0 94h120M0 108h120"/></g>
 <g transform="translate(60 60) rotate(${a}) scale(.8)"><rect x="-24" y="-54" width="56" height="116" rx="9" fill="#000" opacity=".45" filter="url(#b${u})"/>
 <rect x="-28" y="-58" width="56" height="116" rx="9" fill="${body}"/><rect x="-28" y="-58" width="56" height="116" rx="9" fill="url(#s${u})"/>${cam(ct)}${logo}${sc}</g></svg>`}

function render(){
 $("money").textContent=rub(S.money)+(S.usd?" · $"+Math.round(S.usd).toLocaleString("ru-RU"):"");$("day").textContent="День "+S.day;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const v=$("view");
 if(tab==="market")v.innerHTML=S.market.length?S.market.map(p=>`<div class="card"><div class="imgw" onclick="look(${p.id})">${img(p)}<small>Осмотреть</small></div><div class="info"><div class="name">${M[p.m][0]}</div><div>${tags(p)}</div>
  <div class="meta">Рынок: ${rub(val(p))} ${trend(p.m)}</div><div class="btns"><button class="pri" onclick="buy(${p.id})">Купить за ${rub(p.price)}</button></div></div></div>`).join(""):`<div class="empty">Всё раскуплено. Жми «Следующий день».</div>`;
 if(tab==="stock")v.innerHTML=`<div class="meta" style="margin-bottom:8px">Склад: ${S.inv.length} / ${MAXINV}</div>`+(S.inv.length?S.inv.map(p=>`<div class="card"><div class="imgw" onclick="look(${p.id})">${img(p)}<small>Осмотреть</small></div><div class="info"><div class="name">${M[p.m][0]}</div><div>${tags(p)}</div>
  <div class="meta">Куплен за ${rub(p.paid)} · сейчас ${rub(val(p))} ${trend(p.m)}</div><div class="btns"><button class="pri" onclick="sell(${p.id})">Продать ${rub(val(p)*.93)}</button><button onclick="goFlash(${p.id})">Прошить</button></div></div></div>`).join(""):`<div class="empty">Склад пуст. Загляни на рынок.</div>`);
 if(tab==="flash")renderFlash(v);
 if(tab==="avito")renderAvito(v);
 if(tab==="bourse")renderBourse(v);
}
function types(p){if(isIos(p))return[];if(p.fw==="brick"||p.fw==="locked")return["off"];if(p.fw==="stock")return["cust"];return["off","cust"]}
function chance(p,t){return t==="cust"?.8:p.fw==="brick"?.55:p.fw==="locked"?.75:.95}

function profile(){ovShow(`<div class="name">Профиль: ${esc(UNAME)}</div><div class="meta" style="margin:6px 0">${DB?"Облако подключено. Прогресс сохраняется автоматически.":"Облако недоступно: прогресс хранится только на этом устройстве."}</div>${UID?`<div class="meta" style="margin-bottom:6px;overflow-wrap:anywhere">Твой ID: ${esc(UID)}</div>`:""}<div class="btns"><button class="pri" onclick="saveNow()">Сохранить</button><button onclick="askName()">Сменить имя</button>${ADMIN?`<button onclick="admin()">Панель разработчика</button>`:""}<button onclick="logout()">Выйти</button><button onclick="closeLook()">Закрыть</button></div>`)}
async function setRate(d,abs){const v=abs?+$("rt").value:(RATE_GLOBAL||S.rate)+d,r=Math.max(1,Math.min(1000,Math.round(v*10)/10));if(!r)return;
 try{await DB.doc("config/market").set({rate:r,t:Date.now()});RATE_GLOBAL=r;S.rate=r;admV.rt="";say(`Курс изменён: 1 $ = ${r} ₽`);save();admR()}catch(e){say("Не удалось изменить курс: "+(e.code||e.message))}}
async function giveTo(self){const r=Math.round(+$("ar").value||0),u=+$("au").value||0;if(!r&&!u)return say("Введи сумму.");
 if(self){S.money=Math.max(0,S.money+r);S.usd=Math.max(0,Math.round((S.usd+u)*100)/100);save();render();return say("Баланс изменён.")}
 if(!pickId)return say("Выбери игрока.");
 try{await DB.doc("mail/g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({to:pickId,type:"gift",rub:r,usd:u,claimed:false,t:Date.now(),aid:"admin"});say("Отправлено. Игрок получит при следующем открытии игры.");admV={r:"",u:"",rt:""};admR()}catch(e){say("Не удалось отправить: "+(e.code||e.message))}}
/* ---- обязательная регистрация, баны ---- */
let BANS=new Set();
function gateShow(h){let g=document.getElementById("gate");if(!g){g=document.createElement("div");g.id="gate";document.body.appendChild(g)}
 g.style.cssText="position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:12px;overflow:auto";g.innerHTML=`<div class="box" style="max-width:420px;width:100%;background:var(--card);border-radius:12px;padding:14px">${h}</div>`}
function gateHide(){const g=document.getElementById("gate");if(g)g.remove()}
function gateFail(m){onlineErr=m;gateShow(`<div class="name">Нет подключения</div><div class="meta" style="margin:6px 0">${esc(nice(m))}</div><div class="btns"><button class="pri" onclick="location.reload()">Повторить</button></div>`)}
function banGate(r){stopSubs();gateShow(`<div class="name">Аккаунт заблокирован</div><div class="meta" style="margin:6px 0">${esc(r||"Нарушение правил игры.")}</div><div class="btns"><button onclick="location.reload()">Проверить снова</button></div>`)}
const nameId=n=>n.trim().toLowerCase().replace(/\s+/g,"_");
const NAMERE=/^[A-Za-zА-Яа-яЁё0-9_ \-]{3,20}$/;
async function claimName(n){const r=DB.doc("names/"+nameId(n));try{const x=await r.get();if(x.exists)return x.data().uid===UID;await r.set({uid:UID,name:n});return true}catch(e){return false}}
function regGate(msg){gateShow(`<div class="name">Регистрация</div><div class="meta" style="margin:6px 0">${esc(msg||"Придумай имя игрока (3–20 символов: буквы, цифры, пробел, _ и -). Оно должно быть уникальным, его увидят другие игроки.")}</div><input id="rgn" maxlength="20" placeholder="Имя игрока" style="${INP}"><div class="btns"><button class="pri" onclick="regDo()">Зарегистрироваться</button></div>`)}
async function regDo(){const n=$("rgn").value.trim().replace(/\s+/g," ");if(!NAMERE.test(n))return regGate("Имя: 3–20 символов, только буквы, цифры, пробел, _ и -.");
 if(!(await claimName(n)))return regGate("Это имя уже занято, выбери другое.");S.pname=n;UNAME=n;save();try{await cloudPush()}catch(e){}startOnline();render()}
async function setName(){const n=$("lnm").value.trim().replace(/\s+/g," ");if(!NAMERE.test(n))return say("Имя: 3–20 символов, только буквы, цифры, пробел, _ и -.");
 if(nameId(n)!==nameId(S.pname||"")){if(!(await claimName(n)))return say("Это имя уже занято.");if(S.pname)try{await DB.doc("names/"+nameId(S.pname)).delete()}catch(e){}}
 S.pname=n;UNAME=n;save();announce();closeLook();say(`Привет, ${n}!`)}
async function onUser(user){
 if(!user){stopSubs();DB=null;UID=null;AUTH.signInAnonymously().catch(e=>gateFail(nice(e.code||e.message)));return}
 UID=user.uid;DB=firebase.firestore();if(!fsSet){fsSet=true;try{DB.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}}onlineErr="";
 gateShow(`<div class="name">Загрузка профиля…</div>`);
 try{const b=await DB.doc("bans/"+UID).get();if(b.exists){banGate(b.data().reason);return}}catch(e){}
 await cloudLoad();UNAME=S.pname||"";
 if(!S.pname){regGate();return}
 if(!(await claimName(S.pname))){S.pname="";regGate("Твоё имя уже занято другим игроком, выбери новое.");return}
 startOnline()}
function startOnline(){gateHide();announce();adminCheck();stopSubs();
 unsubs.push(DB.doc("bans/"+UID).onSnapshot(x=>{if(x.exists)banGate(x.data().reason)},()=>{}));
 unsubs.push(DB.doc("config/market").onSnapshot(c=>{if(c.exists&&c.data().rate){RATE_GLOBAL=+c.data().rate;S.rate=RATE_GLOBAL;if(!(tab==="bourse"&&bsub==="auc"))render()}},()=>{}));
 unsubs.push(DB.collection("auctions").where("status","==","open").onSnapshot(x=>{AUC=x.docs.map(d=>({id:d.id,...d.data()}));AUC.forEach(a=>{if(a.ends<=Date.now())settle(a)});if(tab==="bourse"&&bsub==="auc")bsec()},e=>{dbErr=e.code||e.message;if(tab==="bourse")bsec()}));
 unsubs.push(DB.collection("mail").where("to","==",UID).where("claimed","==",false).onSnapshot(x=>x.docs.forEach(d=>claim(d.id,d.data())),e=>{dbErr=e.code||e.message}));
 if(!tick)tick=setInterval(()=>{if(DB){AUC.forEach(a=>{if(a.ends<=Date.now())settle(a)});if(tab==="bourse"&&bsub==="auc")bsec()}},30000)}
async function admin(){ovShow(`<div class="meta">Загружаю игроков…</div>`);try{const q=await DB.collection("players").get();PL=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,40)}catch(e){PL=[]}
 try{const b=await DB.collection("bans").get();BANS=new Set(b.docs.map(d=>d.id))}catch(e){}admR()}
async function ban(on){if(!pickId)return say("Выбери игрока.");if(pickId===UID)return say("Себя банить нельзя.");
 try{if(on){await DB.doc("bans/"+pickId).set({reason:($("brs").value||"").slice(0,100),t:Date.now()});BANS.add(pickId);say("Игрок забанен.")}else{await DB.doc("bans/"+pickId).delete();BANS.delete(pickId);say("Бан снят.")}admR()}catch(e){say("Ошибка: "+(e.code||e.message))}}
function admR(){const g=id=>$(id)?$(id).value:"";if($("ar"))admV={r:g("ar"),u:g("au"),rt:g("rt"),b:g("brs")};
 ovShow(`<div class="name">Панель разработчика</div><div class="meta" style="margin:6px 0">Курс: 1 $ = ${(RATE_GLOBAL||S.rate).toFixed(1)} ₽ (для всех игроков)</div>
 <div class="btns"><button onclick="setRate(-5)">−5</button><button onclick="setRate(-1)">−1</button><button onclick="setRate(1)">+1</button><button onclick="setRate(5)">+5</button></div>
 <div class="btns"><input id="rt" type="number" value="${esc(admV.rt||"")}" placeholder="Точный курс" style="${INP};width:130px"><button class="pri" onclick="setRate(0,1)">Задать</button></div>
 <div class="meta" style="margin:10px 0 4px">Игрок (последние 40, 🚫 = в бане). Выбран: ${pickId?esc((PL.find(p=>p.id===pickId)||{}).name||pickId):"никто"}</div>
 <div class="pick">${PL.map(p=>`<button class="${p.id===pickId?"on":""}" onclick="pickId='${esc(p.id)}';admR()">${BANS.has(p.id)?"🚫 ":""}${esc(p.name||"?")} · ${esc(p.id.slice(0,4))}</button>`).join("")||"<span class='meta'>Игроков пока нет.</span>"}</div>
 <div class="btns"><input id="ar" type="number" value="${esc(admV.r||"")}" placeholder="± рублей" style="${INP};width:120px"><input id="au" type="number" value="${esc(admV.u||"")}" placeholder="± долларов" style="${INP};width:120px"></div>
 <div class="meta">Минус забирает деньги, плюс выдаёт.</div>
 <div class="btns"><button class="pri" onclick="giveTo(0)">Отправить игроку</button><button onclick="giveTo(1)">Себе</button></div>
 <input id="brs" value="${esc(admV.b||"")}" placeholder="Причина бана (необязательно)" style="${INP};margin-top:10px">
 <div class="btns"><button onclick="ban(1)">Забанить</button><button onclick="ban(0)">Разбанить</button><button onclick="closeLook()">Закрыть</button></div>`)}
let dtap=0;
function devTap(){if(ADMIN)return;if(++dtap>=5){dtap=0;devAsk()}}
function devAsk(){ovShow(`<div class="name">Режим разработчика</div><div class="meta" style="margin:6px 0">Введи код разработчика.</div><input id="dvc" type="password" autocomplete="off" placeholder="Код" style="${INP}"><div class="btns"><button class="pri" onclick="devDo()">Включить</button><button onclick="closeLook()">Отмена</button></div>`)}
async function devDo(){const c=$("dvc").value.trim();if(!c)return;try{await DB.doc("admins/"+UID).set({code:c});ADMIN=true;closeLook();say("Режим разработчика включён. Профиль → Панель разработчика.")}catch(e){say("Неверный код.")}}
function profile(){ovShow(`<div class="name" onclick="devTap()">Профиль: ${esc(UNAME)}</div><div class="meta" style="margin:6px 0">${DB?"Облако подключено. Прогресс сохраняется автоматически.":"Облако недоступно: прогресс хранится только на этом устройстве."}</div><div class="btns"><button class="pri" onclick="saveNow()">Сохранить</button><button onclick="askName()">Сменить имя</button>${ADMIN?`<button onclick="admin()">Панель разработчика</button>`:""}<button onclick="logout()">Выйти</button><button onclick="closeLook()">Закрыть</button></div>`)}
load();mig();render();initOnline();
</script>
</body>
</html>
